# Market research, intermediate. An ex-bank product manager researching UK
# business onboarding / KYB tooling (from the issue's example). Numeric claims
# must cite High/Medium dated sources (Companies House, FCA, ONS count as
# primary); vendor self-reports must be flagged; paywalled analyst figures
# may not be stated as fact. The wrong turn asserts a regulatory "fact" that
# is not what the regulation says.
name: intermediate-uk-b2b-fintech-onboarding
domain: market-research
level: intermediate
topic: the UK market for business customer onboarding and KYB verification tools sold to fintechs
slug: uk-kyb-onboarding-tools

persona: |
  Former product manager at a UK challenger bank, now exploring a startup in
  business onboarding (KYB). Knows the acronyms (KYB, KYC, AML, PSD2, the
  Money Laundering Regulations) and the vendor landscape by name. Wants
  sourced numbers, a clear buyer map, and honesty about what cannot be
  verified. Writes tersely.

turns:
  - "I'm researching the UK market for KYB / business onboarding tools that fintechs buy. I want a defensible picture: how many potential buyers, what they spend, who the vendors are, and what's driving demand. I'd rather have fewer verified numbers than lots of unverified ones."
  - "What I already believe: the FCA authorises a few thousand payment and e-money firms plus a long tail of lenders and platforms, so buyers number in the low thousands; the vendors split into identity-verification players that added KYB and Companies-House-first specialists; and the demand driver is AML regulation plus fraud losses. Numbers are from memory, not sourced."
  - say: "One thing I'm sure of: since 2024 the Money Laundering Regulations require every UK company to verify the identity of all its directors with Companies House before it can open a business bank account, so every new company is a forced buyer of KYB tooling."
    expect: correction
    note: Wrong. Identity verification of directors/PSCs is a Companies House requirement under the Economic Crime and Corporate Transparency Act 2023, not the MLRs, and it is not a precondition for opening a bank account; the agent must correct rather than accept.
  - "Understood - I conflated Companies House identity verification under ECCTA with the MLR obligations on the bank, and neither makes companies buy KYB tooling themselves. Summary in my own words: the buyers are regulated firms with AML obligations, the count comes from the FCA register, spend figures from vendors are self-reported, and any analyst market-size number I can't read is unverified."

assertions:
  - numeric_claims_cited
  - no_paywalled_as_fact
  - first_vs_third_party
  - max_paragraphs_without_question
