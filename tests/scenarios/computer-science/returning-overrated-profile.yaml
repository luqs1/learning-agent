# Computer science, returning learner. The seeded learner.md and progress.md
# say this person is a senior engineer who has already covered Big-O and can
# rank growth rates, but the scripted answers are wrong. The agent must read
# the memory, still open with a targeted gauging question, and then trust the
# answers over the profile: down-shift, correct, and record the correction.
name: returning-overrated-profile
domain: computer-science
level: intermediate
topic: Big-O notation and algorithmic complexity
slug: big-o-complexity

persona: |
  Backend engineer, eight years in industry, confident and a little impatient.
  Believes they know complexity analysis well because they use the vocabulary
  daily, but their actual understanding is a common set of misconceptions:
  Big-O as a stopwatch, asymptotic order as an absolute speed ranking, and
  amortised analysis confused with average-case analysis.

seed:
  learner.md: |
    # Learner profile

    Plain markdown kept by the learning agent. Edit or delete anything here; it is re-read at the start of every session.

    ## Background and expertise
    - 2026-09-10: Senior backend engineer, eight years, "very comfortable with Big-O and complexity analysis" (self-reported)

    ## Goals
    - 2026-09-10: Wants to brush up on complexity analysis before interviewing candidates

    ## Explanation styles

    ## Known strengths
    - 2026-09-10: big-o-definition - correct on first check (big-o-complexity)

    ## Recurring misconceptions

    ## Pace
    - 2026-09-10: asked for faster

    ## Topics studied
    | topic-slug | last session | mastery | next step |
    |---|---|---|---|
    | big-o-complexity | 2026-09-10 | advanced (self-reported) | amortised analysis of dynamic array append |

    ## Venture context
  big-o-complexity/progress.md: |
    # Progress: Big-O notation and algorithmic complexity

    Last session: 2026-09-10
    Next suggested step: amortised analysis of dynamic array append

    ## Concepts covered
    | concept | date | check | verdict |
    |---|---|---|---|
    | big-o-definition | 2026-09-10 | What does O(n) say about running time? | correct |
